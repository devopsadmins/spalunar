services:
  web:
    image: ${IMAGE}
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.services.spalunar.loadbalancer.server.port=3000

        # HTTP com redirecionamento para HTTPS
        - traefik.http.routers.spalunar-http.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
        - traefik.http.routers.spalunar-http.entrypoints=web
        - traefik.http.routers.spalunar-http.middlewares=spalunar-https-redirect
        - traefik.http.routers.spalunar-http.priority=10

        - traefik.http.middlewares.spalunar-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.spalunar-https-redirect.redirectscheme.permanent=true

        # HTTPS com TLS
        # Usa certificados Origin CA da CloudFlare via tls-default.yml do Traefik
        # (padrão em /certs/cloudflare-origin/fullchain.pem)
        - traefik.http.routers.spalunar.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
        - traefik.http.routers.spalunar.entrypoints=websecure
        - traefik.http.routers.spalunar.tls=true
        - traefik.http.routers.spalunar.priority=10
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    image: ${API_IMAGE}
    environment:
      - BLOG_DATABASE_URL=${BLOG_DATABASE_URL}
      - BLOG_ADMIN_TOKEN=${BLOG_ADMIN_TOKEN}
    networks:
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.services.spalunar-api.loadbalancer.server.port=8000

        - traefik.http.routers.spalunar-api-http.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/blog`)
        - traefik.http.routers.spalunar-api-http.entrypoints=web
        - traefik.http.routers.spalunar-api-http.middlewares=spalunar-https-redirect
        - traefik.http.routers.spalunar-api-http.priority=100

        - traefik.http.routers.spalunar-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/blog`)
        - traefik.http.routers.spalunar-api.entrypoints=websecure
        - traefik.http.routers.spalunar-api.tls=true
        - traefik.http.routers.spalunar-api.priority=100
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8000/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  traefik-public:
    external: true
